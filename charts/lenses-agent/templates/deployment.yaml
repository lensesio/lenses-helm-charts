{{/* Deliberately fail helm deployment if these values are set */}}
{{- $outer := . -}}
{{- range tuple "zookeepers" "schemaRegistries" "connectClusters" "kafka" }}
  {{- if hasKey $outer.Values.lensesAgent . }}
    {{ fail (printf "%s%s%s" "Setting configuration value .Values.lensesAgent." . " is deprecated. Please use the provision yaml instead. See documentation here.") }}
  {{ end }}
{{ end }}

{{/* Fail if the deprecated global existingClaim is used */}}
{{- if hasKey .Values.persistence "existingClaim" }}
  {{ fail "The configuration value '.Values.persistence.existingClaim' has been deprecated and split into volume-specific settings. Please migrate to '.Values.persistence.log.existingClaim' for logs volume and '.Values.persistence.provisioning.existingClaim' for provisioning volume." }}
{{ end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{include "fullname" . | quote}}
  labels:
    app: {{include "fullname" . | quote}}
    chart: {{printf "%s-%s" .Chart.Name .Chart.Version}}
    release: {{.Release.Name}}
    heritage: {{.Release.Service}}
    component: "lenses-agent"
    lenses.io/app: {{include "fullname" .}}
    lenses.io/app.type: lenses
    {{- range $key, $value := .Values.labels }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- if .Values.annotations }}
  annotations:
    {{- range $key, $value := .Values.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
spec:
  # Horizontal scaling is not yet supported
  replicas: 1
  selector:
    matchLabels:
      app: {{include "fullname" . | quote}}
  strategy:
    type: {{ default "Recreate" .Values.strategy.type | quote }}
  template:
    metadata:
      labels:
        app: {{include "fullname" . | quote}}
        component: "lenses"
        hostPort: {{ .Values.restPort | quote }}
        containerPort: {{ .Values.restPort | quote }}
        {{- range $key, $value := .Values.labels }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
      annotations:
        {{- with .Values.monitoring }}
        {{- if .enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .port }}"
        prometheus.io/path: "/metrics"
        {{- end }}
        {{- end }}
        {{- range $key, $value := .Values.podTemplateAnnotations }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
        {{- if  (include "lensesAgentAppendConf" .) }}
        checksum/lenses.append.conf: {{ include "lensesAgentAppendConf" . | sha256sum }}
        {{- end }}
    spec:
      {{- if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      {{- end }}
      {{- if .Values.securityContext }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      {{- end }}
      {{- if .Values.dnsPolicy }}
      dnsPolicy: {{ .Values.dnsPolicy }}
      {{- end }}
      {{- if .Values.dnsConfig }}
      dnsConfig:
        {{- toYaml .Values.dnsConfig | nindent 8 }}
      {{- end }}
      {{- if .Values.additionalPodSpec }}
      {{- toYaml .Values.additionalPodSpec | nindent 6 }}
      {{- end }}
      volumes:
        - name: provision-secrets
          secret:
            secretName: {{include "provisionFullname" . | quote}}
        - name: provision-secrets-files
          secret:
            secretName: {{ (printf "%s-%s" (include "provisionFullname" .) "files") | quote}}
       {{- if and (hasKey .Values "containerSecurityContext") (hasKey .Values.containerSecurityContext "readOnlyRootFilesystem") (eq .Values.containerSecurityContext.readOnlyRootFilesystem true) }}
        - name: tmp-volume
          emptyDir: {}
        - name: data-volume
          emptyDir: {}
        {{- end }}
        - name: secrets
          secret:
            secretName: {{include "fullname" . | quote}}
            items:
              - key: lenses.opts.truststore.jks
                path: lenses.opts.truststore.jks
        - name: config
          configMap:
            name: {{include "fullname" . | quote}}
        {{- if .Values.persistence.storageH2.enabled }}
        - name: storage
          persistentVolumeClaim:
            claimName: {{ default (include "storageH2ClaimName" .) .Values.persistence.storageH2.existingClaim }}
        {{- end }}
        {{- if .Values.persistence.log.enabled }}
        - name: logs
          persistentVolumeClaim:
            claimName: {{ default (include "logsClaimName" .) .Values.persistence.log.existingClaim }}
        {{- end }}
        {{- if .Values.persistence.provisioning.enabled }}
        - name: provisioning
          persistentVolumeClaim:
            claimName: {{ default (include "provisioningClaimName" .) .Values.persistence.provisioning.existingClaim }}
        {{- end }}
        {{- if .Values.additionalVolumes }}
          {{- toYaml .Values.additionalVolumes | nindent 8 }}
        {{- end }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- if .Values.image.imagePullSecrets }}
      imagePullSecrets: {{ .Values.image.imagePullSecrets | toYaml | nindent 8 }}
      {{- end }}
      containers:
      - name: {{ .Chart.Name }}
        image: {{ include "lensesAgentImage" . | quote }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- if .Values.additionalContainerSpec }}
        {{- toYaml .Values.additionalContainerSpec | nindent 8 }}
        {{- end }}
        {{- if .Values.containerSecurityContext }}
        securityContext:
          {{- toYaml .Values.containerSecurityContext | nindent 10 }}
        {{- end }}
        ports:
        - containerPort: {{ .Values.restPort }}
        {{- if .Values.lensesAgent.livenessProbe.enabled }}
        livenessProbe:
          httpGet:
            path: /
            port: {{ .Values.restPort }}
          initialDelaySeconds: 300
          periodSeconds: 10
        {{- end }}

        volumeMounts:
          - name: secrets
            mountPath: "/mnt/secrets"
          - name: config
            mountPath: "/mnt/settings/lenses.append.conf"
            subPath: "lenses.append.conf"
          {{- if .Values.persistence.storageH2.enabled }}
          - name: storage
            mountPath: "/data/storage"
          {{- end }}
          {{- if .Values.persistence.log.enabled }}
          - name: logs
            mountPath: "/data/log"
          {{- end }}
          {{- if .Values.persistence.provisioning.enabled }}
          - name: provisioning
            mountPath: "/data/provisioning"
          {{- end }}
          {{- if .Values.additionalVolumeMounts }}
            {{- toYaml .Values.additionalVolumeMounts | nindent 10 }}
          {{- end }}
          - name: provision-secrets
            mountPath: {{ $.Values.lensesAgent.provision.path }}
          - name: provision-secrets-files
            mountPath: {{ $.Values.lensesAgent.provision.path }}/files
        {{- if and (hasKey .Values "containerSecurityContext") (hasKey .Values.containerSecurityContext "readOnlyRootFilesystem") (eq .Values.containerSecurityContext.readOnlyRootFilesystem true) }}
          - name: tmp-volume
            mountPath: /tmp
          - name: data-volume
            mountPath: /data
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        env:
        - name: LENSES_OPTS
          value: {{include "lensesOpts" . | default "" | quote}}
        {{- if .Values.lensesAgent.opts.trustStoreFileData }}
        - name: CLIENT_OPTS_TRUSTSTORE_FILE
          value: "/mnt/secrets/lenses.opts.truststore.jks"
        {{- end }}
        {{- if .Values.lensesAgent.opts.trustStorePassword }}
        - name: CLIENT_OPTS_TRUSTSTORE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{include "fullname" . | quote}}
              key:  "lenses.opts.truststore.password"
        {{- end }}
        - name: LENSES_HEAP_OPTS
          value: |-
                {{- if (.Values.lensesAgent.jvm).heapOpts }}
                {{ .Values.lensesAgent.jvm.heapOpts }}
                {{- else }}
                {{- $limitsMemory := (.Values.resources.limits).memory | default "5Gi" -}}
                {{- $limitsMemoryGi := 0 }}
                {{- $memory := "" }}

                  {{- if regexMatch "[0-9]+Mi" $limitsMemory -}}
                    {{- $memory = regexReplaceAll "[^0-9]" $limitsMemory "" | int -}}
                    {{- $limitsMemoryGi = (round (div $memory 1024) 0) | int -}}
                  {{- else }}
                    {{- $limitsMemoryGi = regexReplaceAll "[^0-9]" $limitsMemory "" | int -}}
                  {{- end -}}

                  {{- if lt $limitsMemoryGi 5 -}}
                    {{- fail (printf "requests.limits.memory must be at least 5Gi. Current value: %d" $limitsMemoryGi) -}}
                  {{- else }}
                    {{- $xmx := sub $limitsMemoryGi 2 }}
                    {{- $xms := div $xmx 2 }}
                    {{ printf "-Xms%dG -Xmx%dG" $xms $xmx }}
                  {{- end }}
                {{- end }}
        - name: LENSES_LOG4J_OPTS
          value: {{include "lensesLogBackOpts" . | default "" | quote}}
        {{- if.Values.lensesAgent.jvm.performanceOpts }}
        - name: LENSES_PERFORMANCE_OPTS
          value: {{ .Values.lensesAgent.jvm.performanceOpts | quote }}
        {{- end }}
        - name: LENSES_PORT
          value: {{ .Values.restPort | quote }}
        - name: LENSES_JMX_PORT
          value: "9101"
        {{- if .Values.lensesAgent.grafanaUrl }}
        - name: LENSES_GRAFANA
          value: {{ .Values.lensesAgent.grafanaUrl | quote }}
        {{- end }}
        # Provisioning
        - name: LENSES_PROVISIONING_PATH
          value: {{ .Values.lensesAgent.provision.path }}
        {{- if .Values.lensesAgent.provision.interval }}
        - name: LENSES_PROVISIONING_INTERVAL
          value: {{ .Values.lensesAgent.provision.interval }}
        {{- if .Values.monitoring.port }}
        - name: PROMETHEUS_METRICS_PORT
          value: {{ .Values.monitoring.port | quote }}
        {{- end }}
        {{- end }}

        # HQ
        - name: LENSESHQ_AGENT_KEY
          valueFrom:
            secretKeyRef:
            {{- if contains "createNew" .Values.lensesAgent.hq.agentKey.secret.type }}
              name: {{ include "agentKeySecretName" . }}
              key: key
            {{ else if contains "precreated" .Values.lensesAgent.hq.agentKey.secret.type }}
              name: {{ .Values.lensesAgent.hq.agentKey.secret.name }}
              key: {{ .Values.lensesAgent.hq.agentKey.secret.key }}
            {{ else if contains "externalSecret" .Values.lensesAgent.hq.agentKey.secret.type }}
              name: {{ .Values.lensesAgent.hq.agentKey.secret.name }}
              key: {{ .Values.lensesAgent.hq.agentKey.secret.key }}
            {{- end }}
        - name: LENSES_TOPICS_EXTERNAL_TOPOLOGY
          value: {{include "topologyTopic" . | quote}}
        - name: LENSES_TOPICS_EXTERNAL_METRICS
          value: {{include "externalMetricsTopic" . | quote}}
        - name: LENSES_TOPICS_METRICS
          value: {{include "metricTopic" . | quote}}

        # Kubernetes Processors
        - name: LENSES_SQL_EXECUTION_MODE
          value: {{ .Values.lensesAgent.sql.mode | quote }}

        # Kubernetes processors
        {{- if eq .Values.lensesAgent.sql.mode "KUBERNETES"}}
        - name: LENSES_KUBERNETES_PROCESSOR_IMAGE_NAME
          value: {{ .Values.lensesAgent.sql.processorImage | quote }}
        - name: LENSES_KUBERNETES_PROCESSOR_IMAGE_TAG
          value: {{ .Values.lensesAgent.sql.processorImageTag | quote }}
        - name: LENSES_KUBERNETES_POD_MEM_LIMIT
          value: {{ .Values.lensesAgent.sql.memLimit | quote }}
        - name: LENSES_KUBERNETES_POD_MEM_REQUEST
          value: {{ .Values.lensesAgent.sql.memRequest | quote }}
        - name: LENSES_KUBERNETES_POD_LIVENESS_INITIAL_DELAY
          value: {{ .Values.lensesAgent.sql.livenessInitialDelay | quote }}
        {{- end }}

        # Lenses configuration flags
        - name: LC_KUBERNETES_MODE
          value: "true"

        # Lenses telemetry flags
        - name: LT_PACKAGE
          value: "helm"

        - name: LT_PACKAGE_VERSION
          value: "{{ .Chart.Version }}"

        {{- if .Values.lensesAgent.pauseExec.enabled }}
        - name: PAUSE_EXEC
          value: "true"
        {{- end }}

        {{- range $key, $value := .Values.lensesAgent.env }}
        - name: {{ $key | quote }}
          value: {{ $value | quote }}
        {{- end }}

        {{- range $key, $value := .Values.lensesAgent.configOverrides }}
        - name: {{ printf "%s" $key | replace "." "_" | upper | quote }}
          value: {{ $value | quote }}
        {{- end }}

        # Additional env variables
        {{- if .Values.lensesAgent.additionalEnv }}
        {{- toYaml .Values.lensesAgent.additionalEnv | nindent 8 }}
        {{- end }}

      {{- if .Values.sidecarContainers }}
      {{- toYaml .Values.sidecarContainers | nindent 6 }}
      {{- end }}

      {{- if .Values.initContainers }}
      initContainers:
      {{- toYaml .Values.initContainers | nindent 6 }}
      {{- end }}
