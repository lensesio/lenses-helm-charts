{{- if and .Values.rbacEnable .Values.namespaceScope }}
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "fullname" . }}
    chart: {{ printf "%s-%s" .Chart.Name .Chart.Version }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    lenses.io/app: {{ include "fullname" . }}
    lenses.io/app.type: lenses-agent-role
rules:
- apiGroups: [""]
  resources:
    - pods/log
  verbs:
    - get
- apiGroups: [""]
  resources:
    - namespaces
  verbs:
    - get
# Status of SQL Processors and K2K apps. Pods are created only through Deployments.
- apiGroups: [""]
  resources:
    - pods
    - events
  verbs:
    - get
    - list
    - watch
# SQL Processor credentials. The Agent never reads a Secret back, so it gets no get/list.
- apiGroups: [""]
  resources:
    - secrets
  verbs:
    - create
    - delete
# K2K app configuration
- apiGroups: [""]
  resources:
    - configmaps
  verbs:
    - get
    - list
    - watch
    - create
    - update
    - delete
# SQL Processor and K2K workloads
- apiGroups: ["apps"]
  resources:
    - deployments
  verbs:
    - get
    - list
    - watch
    - create
    - update
    - delete
# `deployments/scale` is a separate subresource: granting `deployments` does not confer it.
- apiGroups: ["apps"]
  resources:
    - deployments/scale
  verbs:
    - get
    - update

---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "fullname" . }}
    chart: {{ printf "%s-%s" .Chart.Name .Chart.Version }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    lenses.io/app: {{ include "fullname" . }}
    lenses.io/app.type: lenses-agent-role-binding
subjects:
  - kind: ServiceAccount
    namespace: {{ .Release.Namespace }}
    name:  {{ .Values.serviceAccount.name }}
roleRef:
  kind: Role
  name: {{ include "fullname" . }}
  apiGroup: rbac.authorization.k8s.io

{{- end }}
