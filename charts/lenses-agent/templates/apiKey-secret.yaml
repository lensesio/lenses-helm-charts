{{- if contains "createNew" .Values.lenses.hq.apiKey.secret.type }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "apiKeySecretName" . }}
  labels:
    app: {{ include "fullname" . | quote }}
    chart: {{ printf "%s-%s" .Chart.Name .Chart.Version }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    component: "lenses-agent"
    lenses.io/app: {{ include "fullname" . }}
    lenses.io/app.type: lenses-hq-apiKey-secret
type: Opaque
data:
  key: {{ .Values.lenses.hq.apiKey.secret.value | b64enc }}
{{- end }}
