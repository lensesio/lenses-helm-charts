{{- if and .Values.rbacEnable (not .Values.namespaceScope) }}
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "fullname" . }}
  labels:
    app: {{ include "fullname" . }}
    chart: {{ printf "%s-%s" .Chart.Name .Chart.Version }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    lenses.io/app: {{ include "fullname" . }}
    lenses.io/app.type: lenses-agent-cluster-role
rules:
- apiGroups: [""]
  resources:
    - pods/log
  verbs:
    - get
# Cluster-wide, so the Agent can offer and watch every namespace when
# `lenses.kubernetes.namespaces` is not set.
- apiGroups: [""]
  resources:
    - namespaces
  verbs:
    - get
    - list
    - watch
# Status of SQL Processors and K2K apps. Pods are created only through Deployments.
- apiGroups: [""]
  resources:
    - pods
    - events
  verbs:
    - get
    - list
    - watch
# SQL Processor credentials. The Agent never reads a Secret back, so it gets no get/list.
- apiGroups: [""]
  resources:
    - secrets
  verbs:
    - create
    - delete
# K2K app configuration
- apiGroups: [""]
  resources:
    - configmaps
  verbs:
    - get
    - list
    - watch
    - create
    - update
    - delete
# SQL Processor and K2K workloads
- apiGroups: ["apps"]
  resources:
    - deployments
  verbs:
    - get
    - list
    - watch
    - create
    - update
    - delete
# `deployments/scale` is a separate subresource: granting `deployments` does not confer it.
- apiGroups: ["apps"]
  resources:
    - deployments/scale
  verbs:
    - get
    - update
{{- end }}
