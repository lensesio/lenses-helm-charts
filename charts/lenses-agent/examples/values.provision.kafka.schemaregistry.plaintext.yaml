lenses:
  hq:
    agentKey:
      secret:
        type: "createNew"
        name: "agentKey"
        value: "agent_key_kU919kP32b0w7EiV_6d9Lv4Tm3dmvPH4bjyOz4vgqukSLTZ3o"
  provision:
    enabled: true
    version: "2"
    path: /mnt/provision-secrets
    connections:
      grpcServer:
        - name: lenses-hq
          version: 1
          tags: ['hq']
          configuration:
            server:
              value: hq-tls-test-lenses-hq.hq-agent-test.svc.cluster.local
            port:
              value: 10000
            apiKey:
              value: ${LENSESHQ_AGENT_KEY}
      kafka:
        # There can only be one Kafka cluster at a time
        - name: kafka
          version: 1
          tags: ['staging', 'pseudo-data-only']
          configuration:
            kafkaBootstrapServers:
              value:
                - PLAINTEXT://kafka-1.svc.cluster.local:9092
                - PLAINTEXT://kafka-2.svc.cluster.local:9092
            protocol:
              value: PLAINTEXT
            # Metrics are strongly suggested for Kafka
            metricsType:
              value: JMX
            metricsPort:
              value: 9581
      confluentSchemaRegistry:
        # There can only be one schema registry at a time
        - name: schema-registry
          version: 1
          tags: ['staging']
          configuration:
            schemaRegistryUrls:
              value:
                - http://schema-registry-1.svc.cluster.local:8081
                - http://schema-registry-2.svc.cluster.local:8081
            # Usually JMX metrics for the Schema Registry are skipped
            metricsType:
              value: JMX
            metricsPort:
              value: 9582
