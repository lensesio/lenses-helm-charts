### https://docs.lenses.io/6.0/installation/getting-started/helm/ ###

nameOverride: ""
fullnameOverride: ""

image:
  repository:
  # Default to .Chart.AppVersion
  pullPolicy: Always

monitoring:
  enabled: true
  port: 9102

resources:
  requests:
  #   cpu: 1
    memory: 3Gi
  limits:
  #   cpu: 2
    memory: 5Gi

rbacEnable: true

# Lenses container port
restPort: 3030
servicePortName: lenses

serviceAccount:
  create: true
  name: lenses

additionalVolumeMounts:
  - name: hq-truststore
    mountPath: "/mnt/provision-secrets/hq"

additionalVolumes:
  - name: hq-truststore
    secret:
      secretName: hq-agent-test-authority

# Lenses service
service:
  enabled: true
  annotations: {}

containerSecurityContext:
  readOnlyRootFilesystem: false

lensesAgent:
  # Postgres connection
  storage:
    postgres:
      enabled: true
      host: postgres.url
      port: 5432
      username: postgres
      password: changeMe
      database: agent
  # Configuration necessary for agent connecting to HQ
  hq:
    agentKey:
      secret:
        # createNew | precreated | externalSecret
        type: "createNew"
        name: "agentKey"
        value: "agent_key_*"
  provision:
    path: /mnt/provision-secrets
    connections:
      lensesHq:
        - name: lenses-hq
          version: 1
          tags: ['hq']
          configuration:
            server:
              value: hq-tls-test-lenses-hq.hq-agent-test.svc.cluster.local
            port:
              value: 10000
            agentKey:
              value: ${LENSESHQ_AGENT_KEY}
            sslEnabled:
              value: true
            sslTruststore:
              file: "/mnt/provision-secrets/hq/truststore.jks"
            sslTruststorePassword:
              value: ${LENSES_HQ_AGENT_TRUSTSTORE_PWD}
      kafka:
        - name: kafka
          version: 1
          tags: [ "dev", "dev-2", "eu"]
          configuration:
            kafkaBootstrapServers:
              value:
                - SASL_PLAINTEXT://kafka-1.svc.cluster.local:9093
            saslJaasConfig:
              value: org.apache.kafka.common.security.scram.ScramLoginModule required username="lenses-admin-dev-2" password="GLQ8TB3WTUBDQgc6SHwKxW4GIG1nk67w";
            saslMechanism:
              value: SCRAM-SHA-512
            protocol:
              value: SASL_PLAINTEXT
            metricsType:
             value: JMX
            metricsPort:
             value: 9999
  additionalEnv:
    - name: LENSES_HQ_AGENT_TRUSTSTORE_PWD
      valueFrom:
        secretKeyRef:
          name: hq-agent-test-authority
          key: truststore.jks.password
