suite: with opts truststore set
templates:
  - deployment.yaml
  - secrets.yaml
tests:
  - it: should fail with JVM trustStoreFileData
    set:
      lensesAgent:
        jvm:
          trustStoreFileData: bGFsYQ==
    asserts:
      - template: secrets.yaml
        failedTemplate:
          errorMessage: .Values.lensesAgent.jvm.trustStoreFileData is deprecated in favor of Values.lensesAgent.opts.trustStoreFileData, please use the latter.
  - it: should fail with JVM trustStorePassword
    set:
      lensesAgent:
        jvm:
          trustStorePassword: foobar
    asserts:
      - template: secrets.yaml
        failedTemplate:
          errorMessage: .Values.lensesAgent.jvm.trustStorePassword is deprecated in favor of Values.lensesAgent.opts.trustStorePassword, please use the latter.
