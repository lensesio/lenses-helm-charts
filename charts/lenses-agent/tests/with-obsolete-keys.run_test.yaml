suite: check that using any obsolete Lenses keys will fail the Helm deployment
templates:
  - deployment.yaml
tests:
  - it: should fail if kafka key is still set
    set:
      lensesAgent:
        kafka:
          bootstrapServers:
            - name: kafka
              port: 9092
              sslPort: 9093
              saslSslPort: 9094
              saslPlainTextPort: 9095
    asserts:
      - template: deployment.yaml
        failedTemplate:
          errorMessage: Setting configuration value .Values.lensesAgent.kafka is deprecated. Please use the provision yaml instead. See documentation here.
  - it: should fail if schemaRegistries key is still set
    set:
      lensesAgent:
        schemaRegistries:
          enabled: true
    asserts:
      - template: deployment.yaml
        failedTemplate:
          errorMessage: Setting configuration value .Values.lensesAgent.schemaRegistries is deprecated. Please use the provision yaml instead. See documentation here.
  - it: should fail if connectClusters key is still set
    set:
      lensesAgent:
        connectClusters:
          enabled: true
    asserts:
      - template: deployment.yaml
        failedTemplate:
          errorMessage: Setting configuration value .Values.lensesAgent.connectClusters is deprecated. Please use the provision yaml instead. See documentation here.
