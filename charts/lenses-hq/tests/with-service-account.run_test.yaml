suite: add service account and verify that pod is honoring them
templates:
  - deployment.yaml
tests:
  - it: should work with default values
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: default
  - it: should honor custom Service Account
    set:
      serviceAccount.name: foo_bar
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: foo_bar
  # `isNull` rather than `notExists`: an absent path reads as null, and isNull is
  # available in every helm-unittest version. notExists is newer than the plugin
  # in the CI image, where it fails the whole suite with "Assertion type
  # `notExists` is invalid".
  - it: should not emit automountServiceAccountToken by default
    asserts:
      - isNull:
          path: spec.template.spec.automountServiceAccountToken
  - it: should not emit automountServiceAccountToken when explicitly enabled
    set:
      serviceAccount.automountToken: true
    asserts:
      - isNull:
          path: spec.template.spec.automountServiceAccountToken
  - it: should not mount a ServiceAccount token when disabled
    set:
      serviceAccount.automountToken: false
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
