nameOverride: ""
fullnameOverride: ""

# -- (dict) Custom deployment annotations
# @section -- Custom deployment values
annotations: {}
# -- (dict) Annotations here go into the PodTemplateSpec at deployment.spec.template.annotations.
# @section -- Custom deployment values
podTemplateAnnotations: {}
# -- (dict) Deployment labels
# @section -- Custom deployment values
labels: {}
# -- (dict) Deployment strategy
# @section -- Custom deployment values
strategy: {}
# -- (dict) Deployment nodeSelector
# @section -- Custom deployment values
nodeSelector: {}
# -- (dict) Deployment tolerations
# @section -- Custom deployment values
tolerations: []
# -- (dict) Deployment affinity rules
# @section -- Custom deployment values
affinity: {}
# -- (dict) Deployment security context
# @section -- Custom deployment values
securityContext: {}
# dnsPolicy: "None" # Optional dnsPolicy and dnsConfig to put into the Deployment's PodTemplateSpec.
# dnsConfig:
#   nameservers:
#     - 1.1.1.1
# containerSecurityContext: # Optional, plugged in into the both the deployment's main app container and the sidecar.
#   allowPrivilegeEscalation: false

# Add Prometheus annotations to the pod for Lenses metric scraping
# * The metrics path is '/metrics' and is not adjustable

#  Resource management
# -- Pod resources
# @section -- Custom deployment values
resources:
  requests:
  #   cpu: 1
    memory: 2Gi
  limits:
  #   cpu: 2
    memory: 4Gi
# -- Image map
# @section -- Custom deployment values
image:
  # -- Image repository
  # @section -- Custom deployment values
  repository: lensesio/lenses-hq

  # -- Default to .Chart.AppVersion
  # tag:
  # -- Image pullPolicy
  # @section -- Custom deployment values
  pullPolicy: IfNotPresent
  # -- imagePullSecrets: # any image pull secrets for private registries go here
  #   - name: regcred

# -- (bool) rbacEnable indicates if a the cluster has rbac enabled and a cluster role  and rolebinding should be created for the service account
# @section -- Permission scope values
rbacEnable: true

# -- (bool)  In case rbac is enabled you can choose to enable creation on namespace scoped roles
# instead of cluster roles instead
# @section -- Permission scope values
namespaceScope: true

# -- (int) Lenses HQ service port, service targets restPort
# @section -- Lenses HQ deployment service values
servicePort: 80
# -- (string) Lenses HQ service port name
# @section -- Lenses HQ deployment service values
servicePortName: lenses-hq

# NOTE: When `mcp.enabled` is true, the MCP sidecar listens on pod port **8000**
# (the `lensesio/mcp` image default, which is not configurable here). If you
# change `lensesHq.http.address` / `lensesHq.agents.address` / `lensesHq.metrics.prometheusAddress`
# below, do not use port 8000 — it is reserved for MCP.

# -- User to be used by Lenses to deploy apps
# @section -- Permission scope values
serviceAccount:
  # -- (bool) In case "true" new SA will be created with service.name as a SA name.
  # @section -- Permission scope values
  create: false

  # -- (string) Name of Service Account. In case serviceAccount.create is *false*, existing SA with defined name here will be used.
  # @section -- Permission scope values
  name: default

  # -- (dict) Additional service account annotations.
  # @section -- Permission scope values
  annotations: {}

# @section -- Lenses HQ deployment service values
service:
  # -- (bool) Deciding factor whether Lenses HQ service will be created and which type
  # @section -- Lenses HQ deployment service values
  enabled: true

  # -- (string) Type of service to be created.
  # @section -- Lenses HQ deployment service values
  type: ClusterIP

  # -- (dict) Additional service annotations
  # @section -- Lenses HQ deployment service values
  annotations: {}

  # If you want to make it available as a node port, then add nodePort: <somePort>
  # Warning: this should not be used with servicePort:
  # Warning nodePort is deprecated and will be removed on next Lenses major version upgrade
  # nodePort:
  # -- (string)
  # @section -- Lenses HQ deployment service values
  externalTrafficPolicy:

  ## Load balancer IP address
  ## Is not required, but allows for static address with
  ## serviceType LoadBalancer.
  ## If not supported by cloud provider, this field is ignored.
  ## Default: nil
  ##
  # loadBalancerIP: 130.211.x.x

  ## This will restrict traffic through the cloud-provider load-balancer
  ## to the specified client IPs.
  ## If not supported by cloud provider, this field is ignored.
  ## Default: nil
  ##
  # loadBalancerSourceRanges:
  #   - 0.0.0.0/0

ingress:
  agent:
    # -- (bool) If true, Ingress will be created
    # @section -- Lenses HQ Agent Ingress deployment service values
    enabled: false
    # -- (string) Object defines the Kubernetes Ingress resource for the agent, including the apiVersion, kind, metadata (e.g., name),
    #  and spec with routing rules, host, HTTP paths, and the backend service details (name and port).
    # @section -- Lenses HQ Agent Ingress deployment service values
    agentIngressConfig: {}


  http:
    # -- (bool) If true, Ingress will be created
    # @section -- Lenses HQ HTTP API deployment service values
    enabled: false

    # -- (tpl/string) Set custom host name. (DNS name convention)
    # @notationType -- tpl
    # @section -- Lenses HQ HTTP API deployment service values
    host: ""

    # @notationType -- tpl
    # @section -- Lenses HQ HTTP API deployment service values
    ingressClassName: ""

    # -- (dict) Custom Ingress annotations
    # @section -- Lenses HQ HTTP API deployment service values
    annotations: {}
      # Optionally add here the annotations related to the ingress provider, see examples below:
      # kubernetes.io/ingress.class: traefik
      # kubernetes.io/ingress.class: nginx
      # kubernetes.io/tls-acme: 'true'
      # nginx.ingress.kubernetes.io/rewrite-target: /

    # -- TLS if enabled load the tls.crt and tls.keys as a secrets and enable TLS on the ingress
    # @section -- Lenses HQ HTTP API deployment service values
    tls:
      # -- (bool) Set to true to enable HTTPS
      # @section -- Lenses HQ HTTP API deployment service values
      enabled: false

      # -- (string) Secret name where tls certificates are being stored.
      # The TLS secret must contain keys named tls.crt and tls.key that contain the certificate and private key to use for TLS.
      # @section -- Lenses HQ HTTP API deployment service values
      secretName: ""

# @section -- MCP sidecar values
mcp:
  # -- (bool) Deploy the Lenses MCP Server (`lensesio/mcp`) as a sidecar container
  # alongside HQ, with its own Service and optional Ingress. When enabled, the
  # MCP container listens on pod port **8000** (image default, not configurable).
  # @section -- MCP sidecar values
  enabled: false

  # -- (dict) MCP sidecar container image.
  # @section -- MCP sidecar values
  image:
    # -- Image repository.
    # @section -- MCP sidecar values
    repository: lensesio/mcp
    # -- Default to Chart.yaml `annotations.mcpAppVersion`, then `.Chart.AppVersion`.
    # tag:
    # -- Image pullPolicy.
    # @section -- MCP sidecar values
    pullPolicy: IfNotPresent

  # -- (string) Public URL at which Lenses HQ is reachable by MCP clients — typically
  # the HQ ingress URL, e.g. `https://hq.example.com`. Mapped to the MCP container
  # env var `LENSES_ADVERTISED_URL`. When HQ's embedded OAuth 2.1 authorization server
  # is used (`lensesHq.auth.oauth2.authorizationServer.enabled`), this URL **must**
  # match `lensesHq.auth.oauth2.authorizationServer.issuerURL` — RFC 8414 requires
  # the issuer identifier to be byte-identical to the URL clients dial.
  # @section -- MCP sidecar values
  lensesAdvertisedUrl: ""

  # -- (string) Public URL at which the MCP server is reachable by MCP clients —
  # typically the MCP ingress URL, e.g. `https://mcp.example.com`. Mapped to the
  # MCP container env var `MCP_ADVERTISED_URL`.
  # @section -- MCP sidecar values
  mcpAdvertisedUrl: ""

  # -- (dict) Resources for the MCP sidecar container.
  # @section -- MCP sidecar values
  resources:
    requests:
      memory: 256Mi
    limits:
      memory: 512Mi

  # -- (dict) Liveness probe for the MCP sidecar. Uses a TCP socket check against
  # the MCP port because the `lensesio/mcp` image does not expose a dedicated
  # `/health` endpoint.
  # @section -- MCP sidecar values
  livenessProbe:
    enabled: true

  # -- (dict) Readiness probe for the MCP sidecar. Required so the MCP Service
  # does not route traffic until MCP is actually listening during pod startup.
  # @section -- MCP sidecar values
  readinessProbe:
    enabled: true

  # -- (list) Additional env variables appended to the MCP sidecar container.
  # Follows the format of [EnvVar spec](https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.21/#envvar-v1-core).
  # Note: entries here are appended after the chart-managed env vars; setting a
  # duplicate key (e.g. `LENSES_URL`, `TRANSPORT`, `LENSES_ADVERTISED_URL`,
  # `MCP_ADVERTISED_URL`) is rejected by the Kubernetes API.
  # @section -- MCP sidecar values
  additionalEnv: []
    # - name: INTROSPECTION_CACHE_TTL
    #   value: "60"

  # @section -- MCP sidecar values
  service:
    # -- (bool) Create a dedicated Kubernetes Service for the MCP sidecar.
    # @section -- MCP sidecar values
    enabled: true

    # -- (string) Type of service to be created.
    # @section -- MCP sidecar values
    type: ClusterIP

    # -- (int) Service port. Targets the fixed MCP container port `8000`.
    # @section -- MCP sidecar values
    port: 80

    # -- (dict) Additional service annotations.
    # @section -- MCP sidecar values
    annotations: {}

  # @section -- MCP sidecar values
  ingress:
    # -- (bool) If true, an Ingress resource is created for the MCP service.
    # @section -- MCP sidecar values
    enabled: false

    # -- (string) Set custom host name (DNS name convention). Should correspond to
    # the host in `mcp.mcpAdvertisedUrl`.
    # @section -- MCP sidecar values
    host: ""

    # -- (string) Ingress class name.
    # @section -- MCP sidecar values
    ingressClassName: ""

    # -- (dict) Custom Ingress annotations.
    # @section -- MCP sidecar values
    annotations: {}

    # -- TLS. When enabled, the Ingress terminates TLS using the referenced secret.
    # @section -- MCP sidecar values
    tls:
      # -- (bool) Set to true to enable HTTPS.
      # @section -- MCP sidecar values
      enabled: false

      # -- (string) Secret name where tls certificates are stored. The TLS secret
      # must contain keys named `tls.crt` and `tls.key`.
      # @section -- MCP sidecar values
      secretName: ""

lensesHq:
  agents:
    # -- (string) Address wherefrom agent will be listening at.
    # @section -- Lenses HQ Agent startup values
    # **Required: true**
    address: ":10000"

    tls:
      # -- (string) Enables or disables TLS.
      # @section -- Lenses HQ Agent startup values
      # **Required: true**
      enabled: false

      # -- (string) Enabled verbose of TLS debug logs
      # @section -- Lenses HQ Agent startup values
      # **Required: true**
      verboseLogs: false

      cert:
        # -- (string) Enables usage of secret for certificate.
        # @section -- Lenses HQ Agent startup values
        # **Required: false**
        referenceFromSecret: false
        # -- (string) Secret name where certificate is stored.
        # @section -- Lenses HQ Agent startup values
        # **Required: false**
        secretName: ""
        # -- (string) Secret key where within a secret where certificate is stored.
        # @section -- Lenses HQ Agent startup values
        # **Required: false**
        secretKeyName: ""
        # -- (string) Sets the PEM formatted public certificate.
        # @section -- Lenses HQ Agent startup values
        # **Required: false**
        stringData: |

      # -- (string) Sets the PEM formatted private key.
      # @section -- Lenses HQ Agent startup values
      # **Required: false**
      privateKey:
        # Reference to precreated secret name and key.
        secret:
          name: ""
          key: ""

    # -- (string) Contains Agent gRPC configuration.
    # @section -- Lenses HQ Agent startup values
    # **Required: false**
    grpc:
      # -- (string) Overrides the default maximum body size in bytes for proxied API responses.
      # @section -- Lenses HQ Agent startup values
      # **Required: false**
      apiMaxRecvMessageSize: 33554432

  auth:
    # -- Grants administrator rights to users.
    # @section -- Lenses HQ AUTH startup values
    # **Required: false**
    administrators:
      - "admin"

    # -- Adds uses for password based auth
    # @section -- Lenses HQ AUTH startup values
    # **Required: false**
    users:
      - username: admin
        password: $2a$10$DPQYpxj4Y2iTWeuF1n.ItewXnbYXh5/E9lQwDJ/cI/.gBboW2Hodm # bcrypt("admin").

    # -- (string) # Sets the duration of a session. The duration is a
    # string that follows the Go time.Duration format. Valid time units are "ns",
    # "us" (or "µs"), "ms", "s", "m", "h". The duration is used to set the
    # expiration time of the session cookie.
    # @section -- Lenses HQ SAML startup values
    # **Required: false**
    sessionDuration: "24h"

    saml:
      # -- Enables SAML / SSO authentication
      # @section -- Lenses HQ SAML startup values
      # **Required: true**
      enabled: false
      # -- Defines base URL of Panoptes for IdP redirects.
      # @section -- Lenses HQ SAML startup values
      # **Required: true**
      baseURL: ""

      # -- Defines the Entity ID.
      # @section -- Lenses HQ SAML startup values
      # **Required: true**
      entityID: ""

      # -- Contains the IdP issued XML metadata blob.
      # Example: <?xml version="1.0" ... (big blob of xml) </md:EntityDescriptor>
      # @section -- Lenses HQ SAML startup values
      # **Required: true**
      metadata:
        # -- (boolean) Enables use of configmap to refernence SAML metadata file.
        # @section -- Lenses HQ SAML startup values
        # **Required: true**
        referenceFromSecret: false
        # -- (string) ConfigMap name which contains metadata information.
        # @section -- Lenses HQ SAML startup values
        # **Required: false**
        secretName: ""
        # -- (string) ConfigMap key used to reference configmap metadata information.
        # @section -- Lenses HQ SAML startup values
        # **Required: false**
        secretKeyName: "metadata.xml"
        # -- Contains the IdP issued XML metadata blob.
        # Example: <?xml version="1.0" ... (big blob of xml) </md:EntityDescriptor>
        # @section -- Lenses HQ SAML startup values
        # **Required: true**
        stringData: |

      # -- Controls how the creation of users should be handled in relation to SSO information
      # Allowed values are: sso | manual
      # @section -- Lenses HQ SAML startup values
      # **Required: false**
      userCreationMode: "manual"

      # -- Controls how the management of a user's group membership should be handled in relation to SSO information.
      # Allowed values are: sso | manual
      # @section -- Lenses HQ SAML startup values
      # **Required: false**
      usersGroupMembershipManagementMode: "manual"

      # -- Controls where to redirect to upon successful authentication.
      # @section -- Lenses HQ SAML startup values
      # **Required: false**
      uiRootURL: "/"

      # -- Sets the attribute name for group names.
      # @section -- Lenses HQ SAML startup values
      # **Required: false**
      groupAttributeKey: "groups"

      authnRequestSignature:
        # -- Enabled setting signature certificate in case "Request Signature Verification"
        # enabled on IdP side
        # @section -- Lenses HQ SAML startup values
        # **Required: false**
        enabled: true
        authnRequestSigningCert:
          # -- (string) Enables usage of secret for certificate.
          # @section -- Lenses HQ SAML startup values
          # **Required: false**
          referenceFromSecret: false
          # -- (string) Secret name where certificate is stored.
          # @section -- Lenses HQ SAML startup values
          # **Required: false**
          secretName: ""
          # -- (string) Secret key where within a secret where certificate is sotred.
          # @section -- Lenses HQ SAML startup values
          # **Required: false**
          secretKeyName: ""
          # -- (string) Sets the PEM formatted public certificate.
          # @section -- Lenses HQ SAML startup values
          # **Required: false**
          stringData: |

        authnRequestSigningKey:
          # -- (string) Reference to precreated secret name and key.
          # @section -- Lenses HQ SAML startup values
          # **Required: false**
          secret:
            name: ""
            key: ""

    # @section -- Lenses HQ OAuth2 startup values
    oauth2:
      # -- Controls HQ's OAuth2 embedded authorization server. Rendered into HQ's
      # config only when `authorizationServer.enabled` is true.
      # @section -- Lenses HQ OAuth2 startup values
      authorizationServer:
        # -- (bool) Enables HQ's embedded OAuth 2.1 authorization server.
        # @section -- Lenses HQ OAuth2 startup values
        # **Required: false**
        enabled: false

        # -- (string) The OAuth 2.0 Authorization Server issuer identifier
        # ([RFC 8414](https://datatracker.ietf.org/doc/html/rfc8414)). Must equal the
        # URL that clients use to reach HQ and therefore **must match
        # `mcp.lensesAdvertisedUrl`** when the MCP sidecar is enabled.
        # @section -- Lenses HQ OAuth2 startup values
        # **Required: true when enabled**
        issuerURL: ""

        # -- (string) Absolute maximum lifetime of an authorization grant
        # (Go time.Duration format). Default 2160h (90 days).
        # @section -- Lenses HQ OAuth2 startup values
        # **Required: false**
        grantLifetime: "2160h"

        # -- (bool) Requires PKCE (S256) for all authorization requests.
        # OAuth 2.1 mandates PKCE; leave enabled unless you know why you're disabling it.
        # @section -- Lenses HQ OAuth2 startup values
        # **Required: false**
        requirePKCE: true

        # -- (bool) Enables the dynamic client registration endpoint
        # ([RFC 7591](https://datatracker.ietf.org/doc/html/rfc7591)). MUST be `true`
        # when the MCP sidecar is enabled — MCP clients register themselves via DCR.
        # @section -- Lenses HQ OAuth2 startup values
        # **Required: false**
        dcr: false

        # -- (bool) Allows unauthenticated requests to the `/oauth2/introspect`
        # endpoint. MUST be `true` when the MCP sidecar is enabled, because
        # MCP's `DiscoveryTokenVerifier` posts to the introspection endpoint
        # without client credentials. Keep the HQ introspect endpoint
        # cluster-internal — never expose it through a public ingress.
        # @section -- Lenses HQ OAuth2 startup values
        # **Required: false**
        unauthenticatedIntrospection: false

  http:
    # -- (string) Sets the address the HTTP servers listens at.
    # @section -- Lenses HQ HTTP startup values
    # **Required: true**
    address: ":8080"

    # -- (string) Sets the address the HTTP server listens at.
    # @section -- Lenses HQ HTTP startup values
    # **Required: false**
    accessControlAllowOrigin: []

    # -- Sets the value of the "Access-Control-Allow-Credentials" header.
    # @section -- Lenses HQ HTTP startup values
    # **Required: false**
    accessControlAllowCredentials: false

    # -- Sets the "Secure" attribute on session cookies.
    # @section -- Lenses HQ HTTP startup values
    # **Required: false**
    secureSessionCookies: true

    tls:
      # -- (string) Enables or disables TLS.
      # @section -- Lenses HQ HTTP startup values
      # **Required: true**
      enabled: false

      # -- (string) Enabled verbose of TLS debug logs
      # @section -- Lenses HQ HTTP startup values
      # **Required: true**
      verboseLogs: false

      cert:
        # -- (string) Enables usage of secret for certificate.
        # @section -- Lenses HQ HTTP startup values
        # **Required: false**
        referenceFromSecret: false
        # -- (string) Secret name where certificate is stored.
        # @section -- Lenses HQ HTTP startup values
        # **Required: false**
        secretName: ""
        # -- (string) Secret key where within a secret where certificate is sotred.
        # @section -- Lenses HQ HTTP startup values
        # **Required: false**
        secretKeyName: ""
        # -- (string) Sets the PEM formatted public certificate.
        # @section -- Lenses HQ HTTP startup values
        # **Required: false**
        stringData: |

      # -- (string) Sets the PEM formatted private key.
      # @section -- Lenses HQ HTTP startup values
      # **Required: false**
      privateKey:
        # Reference to precreated secret name and key.
        secret:
          name: ""
          key: ""

  storage:
    postgres:
      # -- (string) Enabling postgres engine. This flag is here as there might be support of multiple database engines in the future.
      # @section -- Lenses HQ Database startup values
      # **Required: true**
      enabled: true
      # -- (string) Hostname of running database instance.
      # @section -- Lenses HQ Database startup values
      # **Required: true**
      host: ""

      # -- (int) Port of running postgress instance. Default is 5432.
      # @section -- Lenses HQ Database startup values
      # **Required: true**
      port: 5432

      # -- (string) Username which will be used for connecting to database database.
      # @section -- Lenses HQ Database startup values
      # **Required: true**
      username: ""

      useSecretForUsername:
        # -- (string) Whether username will be used within a secret or as a part of `username` value.
        # @section -- Lenses HQ Database startup values
        # **Required: true**
        enabled: false
        # -- (string) Secret reference for database user.
        # @section -- Lenses HQ Database startup values
        # **Required: false**
        existingSecret:
          name: ""
          key: ""

      # -- (string) Database name to which HQ will connect to and store required information.
      # @section -- Lenses HQ Database startup values
      # **Required: true**
      database: ""

      # -- (string) Database schema to which HQ will connect to and store required information.
      # @section -- Lenses HQ Database startup values
      # **Required: true**
      schema: ""

      # -- (string) Enables TLS. In PostgreSQL connection string terms, setting TLS to
      #        `false` corresponds to `sslmode=disable`; setting TLS to `true`
      #        corresponds to `sslmode=verify-full`. For more fine-grained control,
      #        specify `sslmode` in the params which takes precedence.
      # @section -- Lenses HQ Database startup values
      # **Required: true**
      tls: false

      # -- (string) Contains connection string parameters as key/values pairs. It allows
      #    fine-grained control of connection settings. The parameters can be found
      #    here: https://www.postgresql.org/docs/current/libpq-connect.html#LIBPQ-PARAMKEYWORDS
      # @section -- Lenses HQ Database startup values
      # **Required: false**
      params: {}

      # -- Definition of secret that has been precreated and has postgres database password
      # @section -- Lenses HQ Database startup values
      passwordSecret:
        # -- (string) Possible options: precreated | createNew | externalSecret
        # @section -- Lenses HQ Database startup values
        type: "precreated"

        # -- (string) Secret name where database password will be stored in case "createNew" or read from in case of "precreated" | "externalSecret".
        # @section -- Lenses HQ Database startup values
        name: ""

        # -- (string) Entry for a password in case of testing where type: "createNew", otherwise can be left out. *NOT FOR PRODUCTION USE!*
        # @section -- Lenses HQ Database startup values
        password: ""

        # -- (string) Secret key where password will be read from
        # @section -- Lenses HQ Database startup values
        key: ""

        externalSecret:
          # -- (string) Additional specifications that would enhance `spec:` of created ExternalSecret
          # @section -- Lenses HQ Database startup values
          additionalSpecs: {}
          creationPolicy: "Owner"
          secretStoreRef:
            # -- (string) Type of secret store created by ESO.
            # @section -- Lenses HQ Database startup values
            type: ""
            # -- (string) Name of cluster secret store created by ESO.
            # @section -- Lenses HQ Database startup values
            name: ""

  # @section -- Lenses HQ startup values
  logger:
    # -- (string) Controls the format of the logger's output. Allowed values are: text | json
    # @section -- Lenses HQ logger startup values
    # **Required: true**
    mode: "text"

    # -- (string) Controls the level of the logger
    # Allowed values are: info | debug
    # @section -- Lenses HQ logger startup values
    # **Required: false**
    level: "info"

  metrics:
    # -- (string) ets the address at which Prometheus metrics are served.
    # If not set, it will default to `:9090``
    # @section -- Lenses HQ metrics startup values
    # **Required: false**
    prometheusAddress: ":9090"

  # @section -- Lenses HQ license values
  license:
    # -- (string) Enables usage of secret for license.
    # @section -- Lenses HQ license values
    # **Required: false**
    referenceFromSecret: false
    # -- (string) Secret name where license is stored.
    # @section -- Lenses HQ license values
    # **Required: false**
    secretName: ""
    # -- (string) Secret key where within a secret where license is sotred.
    # @section -- Lenses HQ license values
    # **Required: false**
    secretKeyName: ""
    # -- (string) Sets the license as a string. Community license available as a default.
    # @section -- Lenses HQ license values
    # **Required: false**
    stringData: "license_key_2SFZ0BesCNu6NFv0-EOSIvY22ChSzNWXa5nSds2l4z3y7aBgRPKCVnaeMlS57hHNVboR2kKaQ8Mtv1LFt0MPBBACGhDT5If8PmTraUM5xXLz4MYv"
    # -- (string) Boolean 'acceptEULA' marks the end-user license agreement (EULA) as accepted.
    # You can find the EULA at: https://lenses.io/legals/eula.
    # @section -- Lenses HQ license values
    # **Required: false**
    acceptEULA: false

  # @section -- Lenses HQ startup values
  # Disable livenessProbe, used while debugging
  livenessProbe:
    # -- (bool)
    # @section -- Lenses HQ startup values
    enabled: true
    tls:
      # -- Enabling HTTPS forliveness probe.
      # @section -- Lenses HQ startup values
      enabled: false

  # -- (string) Additional env variables appended to deployment
  # @section -- Extras
  # Follows the format of [EnvVar spec](https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.21/#envvar-v1-core)
  additionalEnv: []
    # - name: FOO
    #   value: bar


# -- (list) Optionally add arbitrary fields to the pod spec (e.g. priorityClassName, priority, etc)
# @section -- Extras
additionalPodSpec:

# -- (list) # Optionally add arbitrary fields to the main container spec (e.g. tty, stdin, etc)
# @section -- Extras
additionalContainerSpec:

# -- (list) Additional volume mounts to use in Lenses delpoyments, for example to load additional plugins (UDFs) in Lenses
# Use it in conjuction with lenses.additionalVolumes
# @section -- Extras
additionalVolumeMounts:
