{{if and .Values.mcp.enabled .Values.mcp.service.enabled -}}
kind: Service
apiVersion: v1
metadata:
  name: {{include "fullname" .}}-mcp
  labels:
    app: {{include "fullname" .}}
    chart: {{.Chart.Name}}-{{.Chart.Version}}
    component: "lenses-mcp"
    heritage: {{.Release.Service}}
    release: {{.Release.Name}}
    lenses.io/app: {{include "fullname" .}}
    lenses.io/app.type: lenses-mcp-service
    {{- range $key, $value := .Values.labels }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
{{- if .Values.mcp.service.annotations }}
  annotations:
    {{- toYaml .Values.mcp.service.annotations | nindent 4 }}
{{- end }}
spec:
  type: {{ .Values.mcp.service.type | quote }}
  ports:
  - name: mcp
    port: {{ .Values.mcp.service.port }}
    targetPort: mcp
  # The selector intentionally targets component: lenses-hq because MCP runs as
  # a sidecar inside the HQ pod and the pod carries HQ's labels. The
  # component: lenses-mcp label above describes the Service, not the pods it
  # selects. NetworkPolicies that match on component=lenses-mcp will NOT match
  # this Service's backing pods — use component=lenses-hq instead.
  selector:
    app: {{ include "fullname" . }}
    component: "lenses-hq"
{{- end -}}
