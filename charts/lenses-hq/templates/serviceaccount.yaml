{{- if and .Values.serviceAccount.create (eq .Values.serviceAccount.name "default") }}
{{- fail "serviceAccount.create is true but serviceAccount.name is \"default\": Kubernetes provides a `default` ServiceAccount in every namespace, so it cannot be created. Set serviceAccount.name to a dedicated name, or set serviceAccount.create to false to use an existing ServiceAccount." }}
{{- end }}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
{{- if .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml .Values.serviceAccount.annotations | nindent 4 }}
{{- end }}
  labels:
    app: {{ include "fullname" . }}
    chart: {{ printf "%s-%s" .Chart.Name .Chart.Version }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    lenses.io/app: {{ include "fullname" . }}
    lenses.io/app.type: lenses-hq-serviceaccount
{{- end }}
