apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-saml-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-saml
  template:
    metadata:
      labels:
        app: mock-saml
    spec:
      containers:
        - name: mock-saml
          image: boxyhq/mock-saml
          ports:
          - containerPort: 4000
          env:
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: APP_URL
            value: "http://localhost:4000"
          - name: ENTITY_ID
            value: "https://saml.example.com/entityid"
          - name: PUBLIC_KEY
            value: ""
          - name: PRIVATE_KEY
            value: ""
          resources:
            requests:
              memory: "1Gi"
              cpu: 1
            limits:
              memory: "2Gi"
              cpu: 1

---
apiVersion: v1
kind: Service
metadata:
  name: mock-saml-service
spec:
  selector:
    app: mock-saml
  ports:
    - protocol: TCP
      port: 4000
      targetPort: 4000
  type: LoadBalancer
  
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mock-saml-ingress-1
  annotations:
    kubernetes.io/ingress.class: "gce"
spec:
  rules:
  - http:
      paths:
      - pathType: ImplementationSpecific
        path: /
        backend:
          service:
            name: mock-saml-service
            port:
              number: 4000