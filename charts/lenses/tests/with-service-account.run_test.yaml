suite: add service account and verify that pod is honoring them
templates:
  - deployment.yaml
  - serviceaccount.yaml
tests:
  - it: should work with default values
    asserts:
      - template: deployment.yaml
        equal:
          path: spec.template.spec.serviceAccountName
          value: default
      - template: serviceaccount.yaml
        hasDocuments:
          count: 0
      - template: deployment.yaml
        isNull:
          path: spec.template.spec.automountServiceAccountToken
  - it: should honor custom Service Account
    set:
      serviceAccount: foo_bar
    asserts:
      - template: deployment.yaml
        equal:
          path: spec.template.spec.serviceAccountName
          value: foo_bar
      - template: serviceaccount.yaml
        hasDocuments:
          count: 0
  - it: should use an existing ServiceAccount named in the map form
    set:
      serviceAccount:
        name: foo_bar
    asserts:
      - template: deployment.yaml
        equal:
          path: spec.template.spec.serviceAccountName
          value: foo_bar
      - template: serviceaccount.yaml
        hasDocuments:
          count: 0
  - it: should create a dedicated ServiceAccount named after the release
    release:
      name: lenses
    set:
      serviceAccount:
        create: true
    asserts:
      - template: deployment.yaml
        equal:
          path: spec.template.spec.serviceAccountName
          value: lenses
      - template: serviceaccount.yaml
        isKind:
          of: ServiceAccount
      - template: serviceaccount.yaml
        equal:
          path: metadata.name
          value: lenses
  - it: should create a ServiceAccount with a custom name and annotations
    set:
      serviceAccount:
        create: true
        name: lenses-sa
        annotations:
          eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/lenses
    asserts:
      - template: deployment.yaml
        equal:
          path: spec.template.spec.serviceAccountName
          value: lenses-sa
      - template: serviceaccount.yaml
        equal:
          path: metadata.name
          value: lenses-sa
      - template: serviceaccount.yaml
        equal:
          path: metadata.annotations
          value:
            eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/lenses
  - it: should refuse to create a ServiceAccount named default
    set:
      serviceAccount:
        create: true
        name: default
    asserts:
      - template: serviceaccount.yaml
        failedTemplate:
          errorMessage: "serviceAccount.name cannot be \"default\" when serviceAccount.create is true, because Kubernetes already provides a `default` ServiceAccount in every namespace. Leave serviceAccount.name empty to use the release name, set another name, or set serviceAccount.create to false to use an existing ServiceAccount."
  - it: should disable token automount only when automountToken is false
    set:
      serviceAccount:
        automountToken: false
    asserts:
      - template: deployment.yaml
        equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
