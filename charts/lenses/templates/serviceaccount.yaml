{{- if and (include "serviceAccountCreate" .) (eq (include "serviceAccountName" .) "default") }}
{{- fail "serviceAccount.name cannot be \"default\" when serviceAccount.create is true, because Kubernetes already provides a `default` ServiceAccount in every namespace. Leave serviceAccount.name empty to use the release name, set another name, or set serviceAccount.create to false to use an existing ServiceAccount." }}
{{- end }}
{{- if include "serviceAccountCreate" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "serviceAccountName" . }}
  labels:
    app: {{ include "fullname" . }}
    chart: {{ printf "%s-%s" .Chart.Name .Chart.Version }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    lenses.io/app: {{ include "fullname" . }}
    lenses.io/app.type: lenses-serviceaccount
  {{- if .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml .Values.serviceAccount.annotations | nindent 4 }}
  {{- end }}
{{- end }}
